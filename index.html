<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALPOOH - KEY MANAGEMENT</title>
    <!-- ฟอนต์การ์ตูนน่ารัก นุ่มฟู (Mali & Gaegu) -->
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Mali:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mali', cursive, sans-serif; }
        
        body { 
            background-color: #ffffff; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ----- ฟอนต์นูนการ์ตูนน่ารักดุ๊กดิ๊ก ----- */
        .bubble-font {
            font-family: 'Gaegu', 'Mali', cursive, sans-serif;
            font-weight: 700;
            color: #ffffff;
            -webkit-text-stroke: 4px #000000;
            filter: drop-shadow(4px 5px 0px #000000);
            letter-spacing: 3px;
        }

        /* ----- Background Floating REALPOOH ----- */
        .bg-spawn-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .floating-word {
            position: absolute;
            opacity: 0.28;
            user-select: none;
            white-space: nowrap;
            animation: floatUp 10s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 0.28; }
            90% { opacity: 0.28; }
            100% { transform: translateY(-15vh) rotate(20deg) scale(1.1); opacity: 0; }
        }

        /* ----- UI Box สีดำสนิท ----- */
        .container { 
            position: relative;
            z-index: 10;
            width: 100%; 
            max-width: 480px; 
            background: #000000; 
            padding: 32px 24px; 
            border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
            color: #ffffff;
            text-align: center;
        }

        /* ----- รูปภาพเลโก้หมุนเป็นวงกลม 🔄 ----- */
        .lego-spin-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .lego-img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 15px rgba(255,255,255,0.2);
            animation: rotateLego 8s linear infinite;
        }

        @keyframes rotateLego {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 24px;
            text-shadow: 2px 2px 0px #000;
        }

        /* เมนูหมวดหมู่ ปุ่มใหญ่ 2 บรรทัด */
        .tab-menu-vertical { 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            margin-bottom: 24px; 
            width: 100%;
        }
        
        .tab-btn-large { 
            width: 100%;
            padding: 16px 20px; 
            border: 3px solid #27272a; 
            background: #18181b; 
            color: #a1a1aa; 
            font-weight: 700; 
            font-size: 1.15rem;
            cursor: pointer; 
            border-radius: 18px; 
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tab-btn-large:hover { 
            border-color: #ffffff;
            color: #ffffff;
            background: #27272a;
            transform: translateY(-2px);
        }

        .tab-btn-large.active { 
            background: #ffffff; 
            color: #000000; 
            border-color: #ffffff;
            box-shadow: 0 6px 20px rgba(255,255,255,0.25);
        }

        /* พื้นที่เนื้อหา */
        .tab-content { 
            display: none;
            background: #18181b;
            padding: 24px;
            border-radius: 20px;
            border: 2px solid #27272a;
            text-align: left;
        }

        .tab-content.active { display: block; }

        .tab-header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .tab-desc {
            font-size: 0.9rem;
            color: #a1a1aa;
            margin-bottom: 20px;
        }

        /* Form Controls */
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #a1a1aa; font-weight: 700; }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 14px; 
            border: 2px solid #27272a; 
            background: #09090b; 
            color: #ffffff; 
            font-size: 1rem; 
            outline: none;
            font-family: 'Mali', cursive;
        }

        input:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
            border-color: #3f3f46;
        }

        input:focus, select:focus {
            border-color: #ffffff;
        }

        .btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            font-size: 1.1rem;
            cursor: pointer; 
            transition: 0.2s; 
            margin-top: 10px;
            font-family: 'Mali', cursive;
        }

        .btn-white { background: #ffffff; color: #000000; }
        .btn-white:hover { background: #e4e4e7; transform: scale(1.02); }

        .btn-blue { background: #3b82f6; color: #ffffff; }
        .btn-blue:hover { background: #2563eb; transform: scale(1.02); }

        .btn-green { background: #22c55e; color: #000000; margin-top: 12px; }
        .btn-green:hover { background: #16a34a; transform: scale(1.02); }

        /* ผลลัพธ์แสดงคีย์ที่สร้างได้ */
        .key-result-box {
            display: none;
            margin-top: 18px;
            padding: 14px;
            background: #09090b;
            border: 2px dashed #22c55e;
            border-radius: 14px;
            text-align: center;
        }

        .key-result-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4ade80;
            word-break: break-all;
            margin-bottom: 8px;
            user-select: all;
        }

        .btn-copy {
            background: #22c55e;
            color: #000000;
            padding: 8px 16px;
            font-size: 0.9rem;
            margin-top: 4px;
        }
        .btn-copy:hover { background: #16a34a; }

        /* กล่องรายการคีย์ทั้งหมด */
        .key-list-box {
            max-height: 180px;
            overflow-y: auto;
            background: #09090b;
            border: 2px solid #27272a;
            border-radius: 14px;
            padding: 10px;
            margin-top: 8px;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #38bdf8;
            padding: 8px;
            border-bottom: 1px dashed #27272a;
            word-break: break-all;
        }
        .key-item:last-child { border-bottom: none; }

        .btn-delete-small {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-left: 6px;
            white-space: nowrap;
        }
        .btn-delete-small:hover { background: #dc2626; }

        /* กล่องแสดงผลการยืนยันคีย์ */
        .verify-status {
            display: none;
            margin-top: 12px;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
        }
        .status-success { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
        .status-fail { background: #451a1a; color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>

    <!-- พื้นหลังสำหรับปล่อยคำว่า REALPOOH ลอยขึ้นมาตลอดเวลา -->
    <div class="bg-spawn-container" id="bgContainer"></div>

    <!-- UI หลักสีดำ -->
    <div class="container">
        <!-- เลโก้หมุน 🔄 ด้านบน -->
        <div class="lego-spin-wrapper">
            <img class="lego-img" src="https://cdn.discordapp.com/attachments/1533053333546336346/1535327399540031548/IMG_6479.jpg?ex=6a775c91&is=6a760b11&hm=a0723cd91b4b17f61ddaedf1e8c704c9448fdca17541a6fc393e5c370d40a9d6&" alt="Lego Image">
        </div>

        <div class="brand-title bubble-font">REALPOOH</div>

        <!-- เมนูหมวดหมู่ -->
        <div class="tab-menu-vertical">
            <button class="tab-btn-large active" onclick="switchTab('create-key', this)">
                <span>🔑 สร้าง/รับคีย์</span>
                <span>➔</span>
            </button>
            <button class="tab-btn-large" onclick="switchTab('verify-key', this)">
                <span>🌐 เว็บยืนยันคีย์ทั้งหมด</span>
                <span>➔</span>
            </button>
        </div>

        <!-- หมวดที่ 1: สร้าง/รับคีย์ -->
        <div id="create-key" class="tab-content active">
            <div class="tab-header">🔑 สร้าง/รับคีย์ใช้งาน</div>
            <div class="tab-desc">เลือกประเภทอายุใช้งานและระบุจำนวนวัน/เดือน/ปี</div>
            
            <div class="form-group">
                <label>เลือกระยะเวลา</label>
                <select id="timeType" onchange="handleTimeTypeChange()">
                    <option value="DAY">วัน (DAY)</option>
                    <option value="MONTH">เดือน (MONTH)</option>
                    <option value="YEAR">ปี (YEAR)</option>
                    <option value="PERMANENT">ถาวร (PERMANENT)</option>
                </select>
            </div>

            <div class="form-group">
                <label id="amountLabel">จำนวน (สูงสุด 999)</label>
                <input type="number" id="timeAmount" min="1" max="999" value="1" placeholder="กรอกจำนวน 1-999...">
            </div>

            <button class="btn btn-white" onclick="generateKey()">รับคีย์ใช้งาน</button>

            <!-- กล่องแสดงคีย์ที่กดรับ -->
            <div id="keyResultBox" class="key-result-box">
                <div style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 4px;">คีย์ของคุณคือ:</div>
                <div id="generatedKey" class="key-result-text">VIP-1DAY-X89A1K</div>
                <button class="btn btn-copy" onclick="copyKey()">📋 คัดลอกคีย์</button>
            </div>
        </div>

        <!-- หมวดที่ 2: เว็บยืนยันคีย์ทั้งหมด -->
        <div id="verify-key" class="tab-content">
            <div class="tab-header">🌐 ยืนยันคีย์เพื่อเข้าสู่เว็บไซต์</div>
            <div class="tab-desc">ป้อนคีย์เพื่อยืนยันสิทธิ์เข้าใช้งานระบบ</div>

            <div class="form-group">
                <label>ป้อนคีย์ที่ต้องการยืนยัน</label>
                <input type="text" id="inputVerifyKey" placeholder="วางรหัสคีย์ที่นี่ (เช่น VIP-1DAY-XXX)...">
            </div>

            <button class="btn btn-blue" onclick="verifyKey()">🔍 ตรวจสอบยืนยันคีย์</button>

            <!-- แสดงสถานะการยืนยัน + ปุ่มไปยังเว็บที่กำหนด -->
            <div id="verifyStatusBox" class="verify-status"></div>

            <div class="form-group" style="margin-top: 20px;">
                <label>รายการคีย์ทั้งหมดในระบบ (<span id="keyCount">0</span>)</label>
                <div id="allKeysContainer" class="key-list-box">
                    <div style="color: #71717a; text-align: center; font-size: 0.85rem; padding: 10px;">ยังไม่มีคีย์ในระบบ</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 📌 สามารถเปลี่ยน URL เว็บไซต์ปลายทางที่คุณต้องการตรงนี้ได้เลยครับ!
        const targetURL = "https://google.com";

        // ฐานข้อมูลจัดเก็บคีย์
        let globalKeys = JSON.parse(localStorage.getItem('REALPOOH_GLOBAL_KEYS')) || [];

        // ระบบสลับหมวดหมู่
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn-large').forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            if (tabId === 'verify-key') {
                renderKeyList();
            }
        }

        // ระบบควบคุมช่องใส่จำนวน
        function handleTimeTypeChange() {
            const timeType = document.getElementById('timeType').value;
            const timeAmountInput = document.getElementById('timeAmount');

            if (timeType === 'PERMANENT') {
                timeAmountInput.disabled = true;
                timeAmountInput.value = '';
                timeAmountInput.placeholder = 'ถาวร (ไม่ต้องระบุจำนวน)';
            } else {
                timeAmountInput.disabled = false;
                timeAmountInput.value = '1';
                timeAmountInput.placeholder = 'กรอกจำนวน 1-999...';
            }
        }

        // สุ่มรหัสตัวอักษร 1-10 ตัว
        function getRandomCode() {
            const randomLength = Math.floor(Math.random() * 10) + 1;
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < randomLength; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // ระบบสร้างคีย์
        function generateKey() {
            const timeType = document.getElementById('timeType').value;
            const timeAmountInput = document.getElementById('timeAmount');
            let amount = parseInt(timeAmountInput.value);

            if (timeType !== 'PERMANENT') {
                if (isNaN(amount) || amount < 1) amount = 1;
                if (amount > 999) amount = 999;
                timeAmountInput.value = amount;
            }

            const randomCode = getRandomCode();
            const timePrefix = timeType === 'PERMANENT' ? 'PERMANENT' : `${amount}${timeType}`;
            const finalKey = `VIP-${timePrefix}-${randomCode}`;

            // บันทึกคีย์เข้าฐานข้อมูล
            globalKeys.push(finalKey);
            localStorage.setItem('REALPOOH_GLOBAL_KEYS', JSON.stringify(globalKeys));

            document.getElementById('generatedKey').innerText = finalKey;
            document.getElementById('keyResultBox').style.display = 'block';
        }

        // คัดลอกคีย์
        function copyKey() {
            const keyText = document.getElementById('generatedKey').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                alert('คัดลอกคีย์เรียบร้อยแล้ว: ' + keyText);
            });
        }

        // ระบบยืนยันตรวจสอบคีย์
        function verifyKey() {
            const inputKey = document.getElementById('inputVerifyKey').value.trim();
            const statusBox = document.getElementById('verifyStatusBox');

            if (!inputKey) {
                alert('กรุณากรอกหรือวางคีย์ที่ต้องการตรวจสอบ!');
                return;
            }

            if (globalKeys.includes(inputKey)) {
                statusBox.className = 'verify-status status-success';
                statusBox.innerHTML = `
                    <div>✅ ยืนยันคีย์ถูกต้องสำเร็จ!</div>
                    <button class="btn btn-green" onclick="goToTargetWebsite()">🚀 เข้าสู่เว็บไซต์ที่กำหนด</button>
                `;
            } else {
                statusBox.className = 'verify-status status-fail';
                statusBox.innerHTML = `❌ ยืนยันไม่สำเร็จ! ไม่พบข้อมูลคีย์นี้ในระบบ`;
            }
            statusBox.style.display = 'block';
        }

        // ฟังก์ชันเปิดไปหน้าเว็บที่กำหนด
        function goToTargetWebsite() {
            window.open(targetURL, '_blank');
        }

        // แสดงรายการคีย์ทั้งหมด
        function renderKeyList() {
            const container = document.getElementById('allKeysContainer');
            const countLabel = document.getElementById('keyCount');
            countLabel.innerText = globalKeys.length;

            if (globalKeys.length === 0) {
                container.innerHTML = `<div style="color: #71717a; text-align: center; font-size: 0.85rem; padding: 10px;">ยังไม่มีคีย์ในระบบ</div>`;
                return;
            }

            container.innerHTML = globalKeys.map((k, index) => `
                <div class="key-item">
                    <span>🔑 ${k}</span>
                    <button class="btn-delete-small" onclick="deleteKey(${index})">ลบ</button>
                </div>
            `).join('');
        }

        // ระบบลบคีย์รายตัว
        function deleteKey(index) {
            if (confirm(`คุณต้องการลบคีย์ "${globalKeys[index]}" ออกจากระบบใช่หรือไม่?`)) {
                globalKeys.splice(index, 1);
                localStorage.setItem('REALPOOH_GLOBAL_KEYS', JSON.stringify(globalKeys));
                renderKeyList();
            }
        }

        // ระบบสุ่มสร้างคำว่า REALPOOH ลอยขึ้นเรื่อยๆ
        const bgContainer = document.getElementById('bgContainer');

        function createFloatingWord() {
            const word = document.createElement('div');
            word.classList.add('floating-word', 'bubble-font');
            word.innerText = 'REALPOOH';

            const randomX = Math.random() * 90;
            const randomSize = Math.floor(Math.random() * 25) + 30;
            const randomDuration = Math.floor(Math.random() * 6) + 8;

            word.style.left = randomX + 'vw';
            word.style.fontSize = randomSize + 'px';
            word.style.animationDuration = randomDuration + 's';

            bgContainer.appendChild(word);

            setTimeout(() => {
                word.remove();
            }, randomDuration * 1000);
        }

        for (let i = 0; i < 6; i++) {
            setTimeout(createFloatingWord, i * 800);
        }

        setInterval(createFloatingWord, 1200);
    </script>

</body>
</html>
